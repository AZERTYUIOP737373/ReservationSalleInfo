<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Collège SOS — Administration</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="page-center">

    <div class="login-card">

        <div class="login-icon">
            🛠️
        </div>

        <span class="badge">
            ADMINISTRATION
        </span>

        <h1>
            Collège SOS
        </h1>

        <p class="subtitle">
            Accès au tableau de bord
        </p>

        <form method="POST">

            <div class="field">

                <label for="password">
                    Mot de passe administrateur
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Votre mot de passe"
                    required
                    autofocus
                >

            </div>

            <button
                type="submit"
                class="submit-button"
            >
                🔐 Se connecter
            </button>

        </form>

        {% if erreur %}

        <div class="error-message">
            {{ erreur }}
        </div>

        {% endif %}

        <a
            href="{{ url_for('index') }}"
            class="back-link"
        >
            ← Retour à Collège SOS
        </a>

    </div>

</div>

</body>
</html>
