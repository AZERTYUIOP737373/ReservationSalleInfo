<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte — Collège SOS</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            padding: 5px;
            margin: 0;
            cursor: pointer;
            font-size: 19px;
            line-height: 1;
            color: #697386;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #172033;
        }
    </style>
</head>

<body>

<div class="page-center">

    <div class="login-card">

        <div class="login-icon">
            👨‍🏫
        </div>

        <span class="badge">
            COMPTE PROFESSEUR
        </span>

        <h1>
            Collège SOS
        </h1>

        <p class="subtitle">
            Créer votre compte professeur
        </p>

        {% if erreur %}
        <div class="error-message">
            {{ erreur }}
        </div>
        {% endif %}

        {% if succes %}
        <div class="success-message">
            {{ succes }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="field">

                <label for="username">
                    Identifiant
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ex. M. Besset"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="field">

                <label for="password">
                    Mot de passe
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="8 caractères minimum"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                        aria-label="Afficher le mot de passe"
                        title="Afficher le mot de passe"
                    >
                        👁️
                    </button>

                </div>

            </div>

            <div class="field">

                <label for="password_confirmation">
                    Confirmer le mot de passe
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password_confirmation"
                        name="password_confirmation"
                        placeholder="Retapez votre mot de passe"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password_confirmation"
                        aria-label="Afficher le mot de passe"
                        title="Afficher le mot de passe"
                    >
                        👁️
                    </button>

                </div>

            </div>

            <div class="field">

                <label for="signup_password">
                    Mot de passe administrateur
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="signup_password"
                        name="signup_password"
                        placeholder="Mot de passe fourni par l'administration"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="signup_password"
                        aria-label="Afficher le mot de passe administrateur"
                        title="Afficher le mot de passe administrateur"
                    >
                        👁️
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="submit-button"
            >
                👨‍🏫 Créer mon compte
            </button>

        </form>

        <a
            href="{{ url_for('connexion') }}"
            class="back-link"
        >
            ← J'ai déjà un compte
        </a>

        <a
            href="{{ url_for('index') }}"
            class="back-link"
        >
            ← Retour à Collège SOS
        </a>

    </div>

</div>

<script>
    const toggleButtons = document.querySelectorAll(".toggle-password");

    toggleButtons.forEach(function(button) {

        button.addEventListener("click", function() {

            const targetId = button.getAttribute("data-target");
            const passwordInput = document.getElementById(targetId);

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                button.textContent = "🙈";

                button.setAttribute(
                    "aria-label",
                    "Masquer le mot de passe"
                );

                button.setAttribute(
                    "title",
                    "Masquer le mot de passe"
                );

            } else {

                passwordInput.type = "password";

                button.textContent = "👁️";

                button.setAttribute(
                    "aria-label",
                    "Afficher le mot de passe"
                );

                button.setAttribute(
                    "title",
                    "Afficher le mot de passe"
                );

            }

        });

    });
</script>

</body>
</html>
