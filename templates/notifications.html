<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='282-2828535_bb-logo-symbol.png') }}">

    <title>Notifications - Collège SOS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #17202a;
        }

        .card {
            width: min(520px, calc(100% - 30px));
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        h1 {
            margin-top: 0;
        }

        p {
            line-height: 1.6;
            color: #5f6b76;
        }

        button,
        a {
            display: inline-block;
            border: 0;
            border-radius: 12px;
            padding: 13px 20px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 10px;
        }

        button {
            background: #1769ff;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.7;
            cursor: default;
        }

        a {
            color: #1769ff;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
            min-height: 22px;
        }

        .success {
            color: #16803c;
        }

        .error {
            color: #c62828;
        }

        .active-button {
            background: #16803c;
            cursor: default;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>🔔 Notifications</h1>

    <p>
        Active les notifications de Collège SOS pour recevoir
        automatiquement les nouveaux signalements sur cet ordinateur.
    </p>

    <button id="enableNotifications">
        🔔 Activer les notifications
    </button>

    <div id="status"></div>

    <a href="/dashboard">
        ← Retour à l'administration
    </a>

</div>


<script>
const publicKey = {{ vapid_public_key|tojson }};

const button = document.getElementById("enableNotifications");
const statusElement = document.getElementById("status");


function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat(
        (4 - base64String.length % 4) % 4
    );

    const base64 = (
        base64String +
        padding
    )
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    const rawData = window.atob(base64);

    const outputArray = new Uint8Array(rawData.length);

    for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }

    return outputArray;
}


function afficherNotificationsActivees() {
    statusElement.className = "success";
    statusElement.textContent =
        "✅ Notifications activées sur cet ordinateur.";

    button.textContent =
        "✅ Notifications activées";

    button.classList.add("active-button");
    button.disabled = true;
}


function afficherNotificationsDesactivees() {
    statusElement.className = "";
    statusElement.textContent = "";

    button.textContent =
        "🔔 Activer les notifications";

    button.classList.remove("active-button");
    button.disabled = false;
}


async function verifierEtatNotifications() {

    try {

        if (!("serviceWorker" in navigator)) {
            return;
        }

        if (!("PushManager" in window)) {
            return;
        }

        if (!("Notification" in window)) {
            return;
        }

        if (!publicKey) {
            statusElement.className = "error";
            statusElement.textContent =
                "❌ La clé publique VAPID n'est pas configurée.";
            return;
        }

        const registration =
            await navigator.serviceWorker.register(
                "/service-worker.js",
                {
                    scope: "/"
                }
            );

        await navigator.serviceWorker.ready;

        const subscription =
            await registration.pushManager.getSubscription();

        if (
            subscription &&
            Notification.permission === "granted"
        ) {
            afficherNotificationsActivees();
        } else {
            afficherNotificationsDesactivees();
        }

    } catch (error) {

        console.error(
            "Erreur lors de la vérification des notifications :",
            error
        );

        afficherNotificationsDesactivees();
    }
}


async function activerNotifications() {

    button.disabled = true;

    statusElement.className = "";
    statusElement.textContent =
        "Activation en cours...";

    try {

        if (!("serviceWorker" in navigator)) {
            throw new Error(
                "Ce navigateur ne prend pas en charge les Service Workers."
            );
        }

        if (!("PushManager" in window)) {
            throw new Error(
                "Ce navigateur ne prend pas en charge les notifications Push."
            );
        }

        if (!("Notification" in window)) {
            throw new Error(
                "Les notifications ne sont pas disponibles."
            );
        }

        if (!publicKey) {
            throw new Error(
                "La clé publique VAPID n'est pas configurée."
            );
        }


        const permission =
            await Notification.requestPermission();

        if (permission !== "granted") {
            throw new Error(
                "Les notifications ont été refusées."
            );
        }


        const registration =
            await navigator.serviceWorker.register(
                "/service-worker.js",
                {
                    scope: "/"
                }
            );

        await navigator.serviceWorker.ready;


        let subscription =
            await registration.pushManager.getSubscription();


        if (!subscription) {

            subscription =
                await registration.pushManager.subscribe({
                    userVisibleOnly: true,

                    applicationServerKey:
                        urlBase64ToUint8Array(
                            publicKey
                        )
                });
        }


        const response =
            await fetch(
                "/api/push/subscribe",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(
                        subscription.toJSON()
                    )
                }
            );


        const result =
            await response.json();


        if (!response.ok || !result.success) {
            throw new Error(
                result.error ||
                "Impossible d'enregistrer les notifications."
            );
        }


        afficherNotificationsActivees();

    } catch (error) {

        console.error(error);

        statusElement.className =
            "error";

        statusElement.textContent =
            "❌ " + error.message;

        button.disabled = false;
    }
}


button.addEventListener(
    "click",
    activerNotifications
);


document.addEventListener(
    "DOMContentLoaded",
    function() {
        verifierEtatNotifications();
    }
);
</script>

</body>
</html>
